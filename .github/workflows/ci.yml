name: ci

# The whole suite is offline — no network, no daemon, no Telegram — so CI is just
# `cargo test`. If it needs anything else, that is a bug in the test, not in this file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macOS because that is where paos runs: the Keychain secret backend and the
    # LaunchAgent are Mac, and a green Linux run would prove less than it appears to.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: paos

      - name: Test
        working-directory: paos
        run: cargo test --workspace --locked

      - name: Build
        working-directory: paos
        run: cargo build --release --locked

      - name: The binaries must actually run
        working-directory: paos
        run: |
          set -euo pipefail
          ./target/release/paos --help >/dev/null
          # Ad-hoc signing is what lets a downloaded binary run without an Apple
          # Developer account; a release that is not signed is a release nobody can use.
          for b in paos paosd; do
            codesign -dv "target/release/$b" 2>&1 | grep -q adhoc \
              || { echo "$b is not ad-hoc signed"; exit 1; }
          done

  linux:
    # Not a second opinion on the tests — the macOS job above is the authoritative run.
    # This exists because the release now ships a Linux binary, and without it the FIRST
    # place Linux breakage appears is a tag push, where it fails the release rather than
    # a pull request. paos did not link on Linux at all for the whole of its history
    # (`__error` is macOS-only; glibc wants `__errno_location`) and nothing here noticed;
    # it was found by hand in a container.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: paos

      - name: Test
        working-directory: paos
        run: cargo test --workspace --locked

      - name: Build
        working-directory: paos
        run: cargo build --release --locked

      - name: The binaries must actually run
        working-directory: paos
        run: ./target/release/paos --help >/dev/null

  dispatcher:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: brew install bats-core
      - name: Test the skill's entry point
        run: bats skill/tests/dispatcher.bats
