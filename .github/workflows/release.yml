name: release

# Builds the single-binary paos + paosd on macOS ARM and publishes them to a GitHub
# Release. This is the whole distribution story, and it is free:
#   * rustc auto-applies an ad-hoc signature on arm64 (flags=0x20002 adhoc,linker-signed)
#   * an ad-hoc-signed binary runs fine — the SIGKILL failure mode needs ad-hoc PLUS
#     com.apple.quarantine
#   * curl does NOT set com.apple.quarantine
# So no Apple Developer account ($99/yr) and no Rust toolchain on the target Mac.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14        # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test
        working-directory: paos
        run: cargo test --workspace --locked

      - name: Build release
        working-directory: paos
        run: cargo build --release --locked

      - name: Verify the binaries are ad-hoc signed and runnable
        working-directory: paos
        run: |
          set -euo pipefail
          for b in paos paosd; do
            codesign -dv "target/release/$b" 2>&1 | grep -q 'adhoc' \
              || { echo "$b is not ad-hoc signed"; exit 1; }
          done
          # A binary that cannot run is not a release.
          ./target/release/paos --help >/dev/null

      - name: Package
        working-directory: paos
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/paos-aarch64-apple-darwin.tar.gz" -C target/release paos paosd
          shasum -a 256 dist/*.tar.gz > dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: paos-aarch64-apple-darwin
          path: paos/dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            paos/dist/paos-aarch64-apple-darwin.tar.gz
            paos/dist/SHA256SUMS
