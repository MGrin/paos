name: release

# Every push to main becomes a release. Builds the single-binary paos + paosd for macOS
# ARM and Linux x86-64 and publishes them, and this is the whole distribution story:
#   * rustc auto-applies an ad-hoc signature on arm64 (flags=0x20002 adhoc,linker-signed)
#   * an ad-hoc-signed binary runs fine — the SIGKILL failure mode needs ad-hoc PLUS
#     com.apple.quarantine
#   * curl does NOT set com.apple.quarantine
# So no Apple Developer account ($99/yr) and no Rust toolchain on the target Mac.
#
# Linux is built on the OLDEST supported runner on purpose: a glibc binary runs on any
# distro with that version or newer, so building on the newest runner would silently
# narrow the audience to people running this year's distro.
#
# WHY ON PUSH RATHER THAN ON A TAG. Tagging by hand meant the published release drifted
# behind what the maintainer was actually running: v0.3.0 sat SEVEN commits behind main
# while every one of those commits was deployed locally. Anyone downloading a release got
# software the author had already moved past, and nothing said so.
#
# The tag is created by this workflow, not before it. A tag push does NOT match
# `branches: [main]`, so tagging from inside cannot re-trigger the run — the loop that
# self-tagging workflows usually create is closed by the trigger, not by a guard.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two pushes in quick succession would otherwise race to compute the same next version
  # from the same latest tag, and the second would fail to create a tag that now exists.
  # Queue them instead of cancelling: every commit on main is meant to get a release, and
  # `cancel-in-progress` would silently skip one.
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      # Without the leading `v`, because every display site already writes one and
      # `paosd vv0.3.1` is what happens when both do.
      bare: ${{ steps.next.outputs.bare }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the version history, and a shallow clone has none — without this the
          # next version is computed from an empty list on every run and every release is
          # v0.0.1.
          fetch-depth: 0

      - name: Next version
        id: next
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          # No tags at all is a real state (a fresh fork), not an error.
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            major_minor="${latest%.*}"
            patch="${latest##*.}"
            next="${major_minor}.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "bare=${next#v}" >> "$GITHUB_OUTPUT"
          echo "next release: $next (previous: ${latest:-none})"

      - name: Tag it
        # The commit message arrives through the ENVIRONMENT, never interpolated into the
        # script. `${{ github.event.head_commit.message }}` inside a `run:` block is
        # substituted as TEXT before bash sees it, so a multi-line message with backticks
        # is executed as shell — which is exactly what happened on the first run of this
        # workflow: the commit body ran as commands and the job died with "too many
        # arguments". It is also the classic Actions script-injection hole, and the fact
        # that only the maintainer can push here makes it a latent one rather than a safe
        # one.
        env:
          TAG: ${{ steps.next.outputs.tag }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"$'\n\n'"$MSG"
          git push origin "$TAG"

  build:
    needs: version
    strategy:
      # One platform failing must not delete the other's artifact — a macOS-only release
      # is still a release, and the log should say which half broke.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-14        # Apple Silicon
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04    # glibc 2.35
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test
        working-directory: paos
        run: cargo test --workspace --locked

      - name: Build release
        working-directory: paos
        # The version the binary REPORTS comes from the tag being cut, not from
        # Cargo.toml. Every release before this one shipped a binary saying v0.1.0,
        # including the one tagged v0.3.0 — `paos version` was answering a question about
        # the crate manifest while the operator was asking about the release.
        env:
          PAOS_RELEASE_VERSION: ${{ needs.version.outputs.bare }}
        run: cargo build --release --locked

      - name: Verify the binaries are ad-hoc signed
        if: runner.os == 'macOS'
        working-directory: paos
        run: |
          set -euo pipefail
          for b in paos paosd; do
            codesign -dv "target/release/$b" 2>&1 | grep -q 'adhoc' \
              || { echo "$b is not ad-hoc signed"; exit 1; }
          done

      - name: The binaries must actually run, and report the version being released
        working-directory: paos
        run: |
          set -euo pipefail
          # A binary that cannot run is not a release. This is the check that would have
          # caught paos not linking on Linux at all — `__error` is macOS-only, glibc wants
          # `__errno_location` — which was found by hand in a container, not by CI.
          ./target/release/paos --help >/dev/null
          # And a release whose binary reports a different version than the tag is a
          # support question waiting to happen.
          ./target/release/paos version | grep -q "${{ needs.version.outputs.bare }}" \
            || { echo "binary does not report ${{ needs.version.outputs.bare }}:"; \
                 ./target/release/paos version; exit 1; }

      - name: Package
        working-directory: paos
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/paos-${{ matrix.target }}.tar.gz" -C target/release paos paosd

      - uses: actions/upload-artifact@v4
        with:
          name: paos-${{ matrix.target }}
          path: paos/dist/*.tar.gz

  publish:
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      # SHA256SUMS is computed HERE, once, over every platform's tarball. Computing it in
      # the build job would have each platform overwrite the other's file in the release,
      # leaving sums that cover one target and claim to cover the release.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body: ${{ github.event.head_commit.message }}
          files: dist/*
